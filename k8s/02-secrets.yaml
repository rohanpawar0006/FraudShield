apiVersion: v1
kind: Secret
metadata:
  name: fraudshield-secrets
  namespace: fraudshield
  labels:
    app.kubernetes.io/name: fraudshield-secrets
    app.kubernetes.io/part-of: fraudshield-platform
type: Opaque
stringData:
  # Base database credentials (replace in production with Vault/SealedSecrets)
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_secure_password_replace_in_prod"

  # Administrative API key for model reload and retrain triggers
  # Generate using: python -c "import secrets; print(secrets.token_urlsafe(32))"
  ADMIN_API_KEY: "admin_secure_key_replace_in_prod"
