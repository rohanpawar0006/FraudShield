apiVersion: v1
kind: ConfigMap
metadata:
  name: fraudshield-config
  namespace: fraudshield
  labels:
    app.kubernetes.io/name: fraudshield-config
    app.kubernetes.io/part-of: fraudshield-platform
data:
  FRAUDSHIELD_ENV: "production"
  LOG_LEVEL: "INFO"
  API_PORT: "8000"
  API_HOST: "0.0.0.0"
  
  # Persistence & Databases
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "fraudshield"
  USE_SQLITE_FALLBACK: "false"

  # MLflow & Model Paths
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  MODEL_NAME: "FraudShield-XGBoost"
  MODEL_VERSION: "1"
  MODEL_LOCAL_PATH: "/app/models/xgboost_model.json"
  PREPROCESSOR_LOCAL_PATH: "/app/models/xgboost_preprocessor.joblib"
  FEAST_REPO_PATH: "/app/feature_repo"

  # Scoring Thresholds
  DECISION_THRESHOLD: "0.99"
  ALERT_THRESHOLD_HIGH: "0.7"
  ALERT_THRESHOLD_MED: "0.3"
  GNN_BLEND_WEIGHT: "0.3"
  BLEND_ALPHA: "1.0"
  BLEND_DECISION_THRESHOLD: "0.99"
  METRICS_WINDOW_SIZE: "1000"

  # Kafka Topics
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC_TRANSACTIONS: "transactions"
  KAFKA_TOPIC_SCORES: "scores"
  KAFKA_TOPIC_DEAD_LETTER: "transactions.dlq"
  KAFKA_CONSUMER_GROUP: "fraudshield-scoring-group"
  
  # Dashboard
  SCORING_SERVICE_URL: "http://serving:8000"

