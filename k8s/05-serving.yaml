apiVersion: v1
kind: Service
metadata:
  name: serving
  namespace: fraudshield
  labels:
    app.kubernetes.io/name: serving
    app.kubernetes.io/part-of: fraudshield-platform
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: serving
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
  namespace: fraudshield
  labels:
    app.kubernetes.io/name: serving
    app.kubernetes.io/part-of: fraudshield-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serving
    spec:
      containers:
        - name: serving
          image: fraudshield-serving:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fraudshield-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fraudshield-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraudshield-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

