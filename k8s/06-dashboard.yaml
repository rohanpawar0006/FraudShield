apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: fraudshield
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: fraudshield-platform
spec:
  type: NodePort
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30501
      name: http
  selector:
    app.kubernetes.io/name: dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: fraudshield
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: fraudshield-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      containers:
        - name: dashboard
          image: fraudshield-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          envFrom:
            - configMapRef:
                name: fraudshield-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fraudshield-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraudshield-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3

