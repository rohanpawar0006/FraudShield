apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: fraudshield
  labels:
    app.kubernetes.io/name: postgres-init-config
    app.kubernetes.io/part-of: fraudshield-platform
data:
  init.sql: |
    -- Schema Initialization for FraudShield
    -- Executed by official postgres:15-alpine image ONLY on first boot when PGDATA is empty.
    -- On subsequent restarts, postgres skips /docker-entrypoint-initdb.d and preserves all data.

    CREATE TABLE IF NOT EXISTS transactions (
        txn_id VARCHAR(64) PRIMARY KEY,
        account_id VARCHAR(64) NOT NULL,
        dest_id VARCHAR(64) NOT NULL,
        amount DOUBLE PRECISION NOT NULL,
        type VARCHAR(32) NOT NULL,
        ts TIMESTAMP WITH TIME ZONE NOT NULL,
        raw JSONB
    );

    CREATE TABLE IF NOT EXISTS scores (
        id SERIAL PRIMARY KEY,
        txn_id VARCHAR(64) REFERENCES transactions(txn_id) ON DELETE CASCADE,
        xgb_score DOUBLE PRECISION NOT NULL,
        gnn_score DOUBLE PRECISION,
        blended_score DOUBLE PRECISION NOT NULL,
        model_version VARCHAR(64) NOT NULL,
        scored_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        latency_ms DOUBLE PRECISION NOT NULL
    );

    CREATE INDEX IF NOT EXISTS idx_scores_blended_score ON scores (blended_score DESC);
    CREATE INDEX IF NOT EXISTS idx_scores_scored_at ON scores (scored_at DESC);
    CREATE INDEX IF NOT EXISTS idx_scores_txn_id ON scores (txn_id);

    CREATE TABLE IF NOT EXISTS cases (
        txn_id VARCHAR(64) PRIMARY KEY REFERENCES transactions(txn_id) ON DELETE CASCADE,
        status VARCHAR(32) NOT NULL DEFAULT 'New',
        assigned_to VARCHAR(64),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_cases_status ON cases (status);

    CREATE TABLE IF NOT EXISTS labels (
        id SERIAL PRIMARY KEY,
        txn_id VARCHAR(64) REFERENCES transactions(txn_id) ON DELETE CASCADE,
        label INTEGER NOT NULL,
        disposition VARCHAR(32) NOT NULL,
        previous_disposition VARCHAR(32),
        analyst VARCHAR(64) NOT NULL,
        comment TEXT,
        labeled_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_labels_txn_id ON labels (txn_id);
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: fraudshield
  labels:
    app.kubernetes.io/name: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fraudshield
  labels:
    app.kubernetes.io/name: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fraudshield
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fraudshield-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraudshield-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: fraudshield-config
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-init
          configMap:
            name: postgres-init-config
